# A static "app" and pinpath behind one nginx: http://localhost:8080 (PORT=… to change)
# Public access for a try; see docs/integration.md for real access control.
services:
  nginx:
    image: nginx:1.29-alpine
    ports: ["${PORT:-8080}:80"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./site:/usr/share/nginx/html:ro
    depends_on: [pinpath]

  pinpath:
    image: ghcr.io/svyatoslavratov/pinpath:latest
    # build: ../..   # or build it from the repository
    read_only: true
    volumes: [pinpath-data:/data]
    environment:
      PINPATH_PROJECT: example
      PINPATH_AUTH: anonymous
      PINPATH_VIEW: "*"
      PINPATH_COMMENT: "*"
      PINPATH_TRUSTED_PROXIES: 172.16.0.0/12

volumes:
  pinpath-data:
